theme = "cscnk52"

[editor]
true-color = true
line-number = "relative"

[editor.auto-save]
focus-lost = true
"after-delay.enable" = true

[editor.cursor-shape]
insert = "bar"

[editor.inline-diagnostics]
cursor-line = "hint"
other-lines = "error"

[editor.lsp]
display-messages = true
display-inlay-hints = true

[editor.soft-wrap]
enable = true
